name: Build and release PDFs

on:
  push:
    branches: ['**']
    paths:
      - '**/*.typ'
      - '**/*.py'
      - '**/*.nix'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'flake.lock'
      - '.github/workflows/release-pdfs.yml'
  pull_request:
    paths:
      - '**/*.typ'
      - '**/*.py'
      - '**/*.nix'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'flake.lock'
      - '.github/workflows/release-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - name: Build reading PDFs with locked fonts and Typst packages
        run: nix build path:.#past-exams --print-build-logs
      - name: Build print PDFs
        run: nix build path:.#print-version --out-link result-print --print-build-logs
      - name: Collect and verify PDF pairs
        run: |
          mkdir release
          cp result/*.pdf result-print/*.pdf release/
          python3 scripts/publish-release.py --directory release --check-only
      - name: Build A4 topic collections
        run: nix build path:.#collections --out-link result-collections --print-build-logs
      - name: Verify complete collection pairs
        run: python3 scripts/publish-release.py --kind collections --directory result-collections --check-only
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-pdfs
          path: release/*.pdf
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: collection-pdfs
          path: result-collections/**/*.pdf
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-pdfs
          path: release
      - name: Verify downloaded PDF pairs
        run: python3 scripts/publish-release.py --directory release --check-only
      - uses: actions/download-artifact@v8.0.2
        with:
          name: collection-pdfs
          path: release-collections
      - name: Verify downloaded collection pairs
        run: python3 scripts/publish-release.py --kind collections --directory release-collections --check-only
      - name: Update rolling PDF release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish-release.py --directory release
      - name: Update subject collection releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish-release.py --kind collections --directory release-collections
