<?xml version="1.0" encoding="UTF-8"?>
<!-- Front-view CRT host traced from the official 2009 scan; source icon unknown. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 55">
  <!-- CRT shell: the scan is frontal, with horizontal top and bottom edges. -->
  <path d="M16 4.5 Q16 3 17.8 3 H47.2 Q49 3 49 4.5 V31.5 H16 Z"
        fill="#a9a9a9" stroke="#777" stroke-width="0.75"/>
  <rect x="19.5" y="7" width="26" height="21.5" rx="1.7"
        fill="#fafafa" stroke="#b8b8b8" stroke-width="0.65"/>

  <!-- Horizontal desktop chassis, seen directly from the front. -->
  <path d="M7.5 31.2 H56.5 Q58.5 31.2 58.5 33.2 V43.2
           Q58.5 45 56.5 45 H7.5 Q5.5 45 5.5 43.2 V33.2
           Q5.5 31.2 7.5 31.2 Z"
        fill="#a7a7a7" stroke="#777" stroke-width="0.75"/>
  <rect x="9" y="34.3" width="11" height="1.5" rx="0.6" fill="#8b8b8b"/>
  <rect x="9" y="37.7" width="18" height="1.3" rx="0.55" fill="#bfbfbf"/>
  <circle cx="53.5" cy="38.2" r="1.1" fill="#717171"/>
  <path d="M6.2 42.6 H57.8" stroke="#696969" stroke-width="1"/>

  <!-- Separate, centred keyboard. -->
  <path d="M10 47.3 H54 L58.5 52 H5.5 Z"
        fill="#c2c2c2" stroke="#858585" stroke-width="0.7"/>
  <path d="M7 52 H57" stroke="#5e5e5e" stroke-width="1.6"/>
  <path d="M14 49.2 H50 M12 50.7 H52" stroke="#a0a0a0" stroke-width="0.55"/>
</svg>
